<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyre Model</title>
  <link rel="stylesheet" href="style.css">
  <script src="nav.js" defer></script>
  <style>
    /* The picture across the top of the page: three fifths of the screen below the nav bar and its 2px border, as on
       the Formula SAE page */
    .project-picture {
      display: block;
      width: 100%;
      height: calc((100vh - var(--nav-height) - 2px) * 0.6);
      height: calc((100svh - var(--nav-height) - 2px) * 0.6);
      object-fit: cover;
    }
    /* A plot is shown whole rather than cropped, so none of its axes or labels are cut off, centred on a white band
       that matches the plot's own background */
    .project-picture.plot {
      box-sizing: border-box;
      padding: 24px 16px;
      object-fit: contain;
      background: #fff;
    }
    /* On phones the plot is only as wide as the screen, so the band shrinks to fit it rather than leaving empty
       white above and below */
    @media (max-width: 720px) {
      .project-picture.plot {
        height: auto;
        padding: 16px 8px;
      }
    }
    /* The project's name over the picture, like the team's name on the Formula SAE page: a grey wash over the
       whole band so white text reads over the white plot (with the curves still showing through), and the
       heading in the nav bar's bold Bookman with a soft shadow */
    .project-hero {
      position: relative;
      margin: 0;
    }
    .project-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(52, 56, 64, 0.5);
      pointer-events: none;
    }
    .project-hero h1 {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0 16px;
      font-family: "ITC Bookman", "Bookman Old Style", "Bookman", "URW Bookman", "URW Bookman L", "TeX Gyre Bonum", serif;
      font-weight: bold;
      font-size: clamp(24px, 3.8vw, 60px);
      line-height: 1.15;
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <nav id="nav">
    <span class="nav-name">William Bartholomew</span>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <!-- This page belongs to Projects, so that link stays highlighted here -->
      <a href="projects.html" aria-current="page">Projects</a>
      <!-- The CV opens in a new tab, like the CV box on the Home drawing -->
      <a href="media/cv.pdf" target="_blank" rel="noopener">CV</a>
    </div>
  </nav>

  <!-- Stub page for the tyre model project, linked from its tile on Projects and its sketch on the Home page's
       Projects sheet. The content goes here. -->
  <main id="content">
    <header class="project-hero">
      <img class="project-picture plot" src="media/tyre-model-fy.png" width="1802" height="749"
        alt="Three MATLAB plots of lateral force against slip angle for the Hoosier 43070 16x6-10 LCO tyre on a 7 inch rim at 10 psi, at inclination angles of 0, 2 and 4 degrees, each with curves for normal loads of 200 to 1100 newtons">
      <h1>Pacejka Magic Formula 5.2 Tyre Model</h1>
    </header>
  </main>
</body>
</html>
