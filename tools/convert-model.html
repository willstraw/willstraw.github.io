<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Converter</title>
  <style>
    body {
      margin: 0 auto;
      max-width: 640px;
      padding: 32px 16px;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      color: #222;
      background: #fff;
    }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    button { margin-top: 24px; padding: 8px 20px; font-size: 15px; cursor: pointer; }
    #status { margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Model converter</h1>
  <p>
    Turns a Fusion OBJ export into the small <code>.bin</code> file the 3D viewer loads, with the outline
    edges worked out in advance. Open this page through Live Server (or another local web server).
  </p>

  <label for="obj">OBJ file</label>
  <input type="file" id="obj" accept=".obj">

  <label for="mtl">MTL file (part colours, exported alongside the OBJ)</label>
  <input type="file" id="mtl" accept=".mtl">

  <label for="angle">Outline edges where faces meet at more than (degrees)</label>
  <input type="number" id="angle" value="35" min="1" max="180">

  <div><button id="convert" type="button">Convert</button></div>
  <div id="status"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { encodeModel } from '../model.js';

    const $ = id => document.getElementById(id);
    const setStatus = text => { $('status').textContent = text; };
    const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const mb = bytes => (bytes / 1048576).toFixed(1) + ' MB';

    $('convert').addEventListener('click', async () => {
      const objFile = $('obj').files[0];
      const mtlFile = $('mtl').files[0];
      if (!objFile) return setStatus('Choose an OBJ file first.');
      $('convert').disabled = true;
      try {
        setStatus('Reading the OBJ…');
        await nextFrame();
        const loader = new OBJLoader();
        if (mtlFile) {
          const materials = new MTLLoader().parse(await mtlFile.text(), '');
          materials.preload();
          loader.setMaterials(materials);
        }
        const object = loader.parse(await objFile.text());

        setStatus('Converting…');
        await nextFrame();
        const bytes = await encodeModel(object, { edgeAngle: Number($('angle').value) });

        const name = objFile.name.replace(/\.obj$/i, '') + '.bin';
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([bytes]));
        link.download = name;
        link.click();
        setStatus(`Saved ${name}: ${mb(bytes.length)} (the OBJ was ${mb(objFile.size)}). ` +
          'Put it next to the page that shows the model.');
      } catch (err) {
        console.error(err);
        setStatus(`Conversion failed: ${err.message}`);
      } finally {
        $('convert').disabled = false;
      }
    });
  </script>
</body>
</html>
